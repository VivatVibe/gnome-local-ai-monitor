<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual-Fan GPU Card Animation Simulator</title>
  <style>
    body {
      background: #18181f;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p.subtitle { color: #9ca3af; font-size: 14px; margin-bottom: 24px; }
    
    .topbar-sim {
      width: 100%;
      max-width: 800px;
      height: 38px;
      background: #101014;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      margin-bottom: 24px;
      border: 1px solid #2e2e38;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.08);
      padding: 3px 10px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .pill svg { width: 24px; height: 24px; }
    .badge { font-weight: 700; font-size: 13px; color: #fff; min-width: 32px; }

    .zoom-box {
      width: 220px;
      height: 180px;
      background: #23232c;
      border: 2px solid #3f3f50;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    }
    .zoom-box svg { width: 140px; height: 140px; }
    .zoom-title { font-size: 13px; font-weight: 600; color: #9ca3af; margin-top: 6px; }

    .controls {
      background: #23232c;
      padding: 16px 24px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 20px;
      border: 1px solid #373748;
    }
    input[type=range] { width: 200px; accent-color: #6366f1; cursor: pointer; }
    .val { font-weight: 700; color: #60a5fa; font-size: 16px; min-width: 45px; }
    .status { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
    .status.idle { background: #374151; color: #d1d5db; }
    .status.running { background: #065f46; color: #6ee7b7; }
  </style>
</head>
<body>

  <h1>🎮 Dual-Fan GPU Card Animation Simulator</h1>
  <p class="subtitle">Hardware Minimalist graphics card with dual spinning fans. Zero-RPM idle at 0% load.</p>

  <div class="topbar-sim">
    <span style="font-weight:600; font-size:13px;">Activities</span>
    <span style="color:#9ca3af; font-size:13px;">Top Bar Real-Scale (24px)</span>
    <div class="pill">
      <div id="simIcon"></div>
      <span class="badge" id="simBadge">0%</span>
    </div>
  </div>

  <div class="zoom-box">
    <div id="zoomIcon"></div>
    <div class="zoom-title">Magnified View (5x)</div>
  </div>

  <div class="controls">
    <label for="loadSlider" style="font-weight:600; font-size:14px;">GPU Compute Load:</label>
    <input type="range" id="loadSlider" min="0" max="100" value="0">
    <span class="val" id="valDisplay">0%</span>
    <span class="status idle" id="statusBadge">❄️ Zero-RPM Mode (Idle)</span>
    <span style="color:#9ca3af; font-size:13px;">Rotation Speed: <strong id="speedDisplay" style="color:#fff;">0 RPM</strong></span>
  </div>

  <script>
    function getGpuSvg(angle, isIdle) {
      const led = isIdle ? '<circle cx="28" cy="11" r="0.9" fill="#9a9996" />' : '<circle cx="28" cy="11" r="0.9" fill="#33d17a" />';
      const fanBlade = `
        <path d="M 0,0 C 0.8,-1.8 2.2,-3.5 3.8,-3.8 C 4.2,-3.2 3.8,-2 2.5,-1 C 1.5,-0.2 0.8,0 0,0 Z
                 M 0,0 C 1.8,0.8 3.5,2.2 3.8,3.8 C 3.2,4.2 2,3.8 1,2.5 C 0.2,1.5 0,0.8 0,0 Z
                 M 0,0 C -0.8,1.8 -2.2,3.5 -3.8,3.8 C -4.2,3.2 -3.8,2 -2.5,1 C -1.5,0.2 -0.8,0 0,0 Z
                 M 0,0 C -1.8,-0.8 -3.5,-2.2 -3.8,-3.8 C -3.2,-4.2 -2,-3.8 -1,-2.5 C -0.2,-1.5 0,-0.8 0,0 Z"
              fill="#ffffff" />
        <circle cx="0" cy="0" r="1.3" fill="#ffffff" stroke="#18181f" stroke-width="0.5" />
      `;

      return `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
          <!-- PCIe Bracket -->
          <path d="M 2,6 H 4 V 26 H 2 Z M 1,5 H 4 V 7 H 1 Z" fill="#ffffff" opacity="0.9" />
          <rect x="2.5" y="10" width="1" height="3" fill="#18181f" />
          <rect x="2.5" y="15" width="1" height="3" fill="#18181f" />

          <!-- PCIe Slot Connector Tab -->
          <path d="M 6,23.5 H 14 V 25.5 H 6 Z" fill="#ffffff" opacity="0.75" />
          <line x1="8" y1="24" x2="8" y2="25" stroke="#18181f" stroke-width="0.6" />
          <line x1="10" y1="24" x2="10" y2="25" stroke="#18181f" stroke-width="0.6" />
          <line x1="12" y1="24" x2="12" y2="25" stroke="#18181f" stroke-width="0.6" />

          <!-- 8-Pin Power Connector -->
          <rect x="23.5" y="7.5" width="5" height="1.8" rx="0.5" fill="#ffffff" opacity="0.8" />
          <line x1="25" y1="7.5" x2="25" y2="9" stroke="#18181f" stroke-width="0.5" />
          <line x1="27" y1="7.5" x2="27" y2="9" stroke="#18181f" stroke-width="0.5" />

          <!-- Main GPU Shroud Body -->
          <rect x="4" y="9.5" width="26.5" height="13.5" rx="1.8" fill="#18181f" stroke="#ffffff" stroke-width="1.3" />
          <line x1="5.5" y1="11" x2="29" y2="11" stroke="#ffffff" stroke-width="0.6" opacity="0.4" />
          <line x1="5.5" y1="21.5" x2="29" y2="21.5" stroke="#ffffff" stroke-width="0.6" opacity="0.4" />

          <!-- Left Fan Housing & Blades -->
          <circle cx="11.5" cy="16.2" r="4.6" fill="#101014" stroke="#ffffff" stroke-width="0.8" />
          <g transform="translate(11.5, 16.2) rotate(${angle})">
            ${fanBlade}
          </g>

          <!-- Right Fan Housing & Blades -->
          <circle cx="22.5" cy="16.2" r="4.6" fill="#101014" stroke="#ffffff" stroke-width="0.8" />
          <g transform="translate(22.5, 16.2) rotate(${angle})">
            ${fanBlade}
          </g>

          ${led}
        </svg>
      `;
    }

    const angles = [0, 22.5, 45, 67.5];
    let frameIdx = 0;
    let timer = null;
    let currentLoad = 0;

    const slider = document.getElementById('loadSlider');
    const valDisplay = document.getElementById('valDisplay');
    const simBadge = document.getElementById('simBadge');
    const simIcon = document.getElementById('simIcon');
    const zoomIcon = document.getElementById('zoomIcon');
    const statusBadge = document.getElementById('statusBadge');
    const speedDisplay = document.getElementById('speedDisplay');

    function update() {
      valDisplay.textContent = `${currentLoad}%`;
      simBadge.textContent = `${currentLoad}%`;

      if (currentLoad === 0) {
        if (timer) { clearInterval(timer); timer = null; }
        statusBadge.className = 'status idle';
        statusBadge.textContent = '❄️ Zero-RPM Mode (Idle)';
        speedDisplay.textContent = '0 RPM (Stationary)';
        const svg = getGpuSvg(0, true);
        simIcon.innerHTML = svg;
        zoomIcon.innerHTML = svg;
      } else {
        statusBadge.className = 'status running';
        statusBadge.textContent = '🔥 Fans Active (Cooling)';
        const ms = Math.max(50, Math.round(200 - (currentLoad * 1.5)));
        const approxRpm = Math.round(1000 + (currentLoad * 22));
        speedDisplay.textContent = `~${approxRpm} RPM (${ms} ms/frame)`;

        if (timer) clearInterval(timer);
        timer = setInterval(() => {
          frameIdx = (frameIdx + 1) % 4;
          const svg = getGpuSvg(angles[frameIdx], false);
          simIcon.innerHTML = svg;
          zoomIcon.innerHTML = svg;
        }, ms);
      }
    }

    slider.addEventListener('input', (e) => {
      currentLoad = parseInt(e.target.value, 10);
      update();
    });

    update();
  </script>
</body>
</html>
